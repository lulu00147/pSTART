[workspace]
resolver = "2"
members = [
    "crates/pstart-core",
    "crates/pstart-ipc",
    "crates/pstart-index",
    "crates/pstart-ntfs",
    "crates/pstart-plugins",
    "crates/pstart-policy",
    "crates/pstart-score",
    "crates/pstart-server",
    "crates/pstart-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["pSTART contributors"]
repository = "https://example.invalid/pstart"
description = "pSTART: native Windows launcher and NTFS file search platform"

[workspace.dependencies]
pstart-core = { path = "crates/pstart-core" }
pstart-ipc = { path = "crates/pstart-ipc" }
pstart-index = { path = "crates/pstart-index" }
pstart-ntfs = { path = "crates/pstart-ntfs" }
pstart-plugins = { path = "crates/pstart-plugins" }
pstart-policy = { path = "crates/pstart-policy" }
pstart-score = { path = "crates/pstart-score" }
pstart-server = { path = "crates/pstart-server" }
pstart-host = { path = "crates/pstart-host" }

serde = { version = "1.0.219", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
thiserror = "2.0.12"
toml = "0.8.23"
rusqlite = { version = "0.40.0", features = ["bundled"] }
tempfile = "3.20.0"
proptest = "1.7.0"
tracing = "0.1.41"
wasmtime = { version = "36.0.20", default-features = false, features = ["std", "runtime", "cranelift", "component-model"] }
vc-ltl = "5.0.9"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn" }
