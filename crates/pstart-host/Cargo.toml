[package]
name = "pstart-host"
description = "pSTART user-session host: hotkey, GDI overlay, native EDIT and plugin dispatch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[features]
vc-ltl = ["dep:vc-ltl"]

[dependencies]
pstart-core.workspace = true
pstart-ipc.workspace = true
pstart-plugins.workspace = true
pstart-policy.workspace = true
rusqlite.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dependencies.vc-ltl]
workspace = true
optional = true

[target.'cfg(windows)'.dev-dependencies]
pstart-server.workspace = true
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
